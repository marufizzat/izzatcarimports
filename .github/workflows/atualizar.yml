# Atualiza o catalogo e PUBLICA o site novo (pasta site/, Astro) no GitHub Pages.
# Roda sozinho a cada 30 min, na venda (venda_ml), no botao manual e a cada push.
# Nada gerado e commitado: o site sai como artefato do Pages (repo para de inchar).
# PRE-REQUISITO (uma vez): Settings -> Pages -> Source = "GitHub Actions".
name: Atualizar catalogo e publicar o site

on:
  schedule:
    - cron: "*/30 * * * *"
  repository_dispatch:
    types: [venda_ml]
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write   # grava as capas de estudio novas no ramo "capas-estudio"
  pages: write
  id-token: write

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TEM_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      # hora do início: os passos que podem demorar (medir fotos) param a tempo de o site sair dentro dos 40 min
      - run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"

      # products.json da rodada anterior (descricoes ja buscadas) + analise das fotos
      - uses: actions/cache/restore@v4
        with:
          path: |
            products.json
            categorias_ml.json
            fotos_limpas.json
          key: catalogo-${{ github.run_id }}
          restore-keys: catalogo-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests python-dotenv pillow

      - name: Puxar anuncios ativos do Mercado Livre (pelo backend)
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          PYTHONIOENCODING: utf-8
        run: python -u atualizar_catalogo.py

      # guarda o cache mesmo se o build falhar depois (nao perde descricoes buscadas)
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            products.json
            categorias_ml.json
            fotos_limpas.json
          key: catalogo-${{ github.run_id }}

      - name: Preparar dados do site (marca, modelo, ano, busca)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -u preparar_dados.py
          python -u testes/test_dados.py

      # ---- Capas de estudio (peca com fundo limpo). Ficam no ramo "capas-estudio";
      # aqui so as das pecas NOVAS sao geradas (rembg) e o ramo e atualizado.
      - name: Buscar capas de estudio ja prontas
        continue-on-error: true   # capa de estudio nunca pode travar a atualizacao do catalogo
        run: |
          git fetch --depth=1 origin capas-estudio:capas-estudio 2>/dev/null || true
          mkdir -p site/public/estudio
          if git rev-parse --verify capas-estudio >/dev/null 2>&1; then
            git --work-tree=site/public/estudio checkout capas-estudio -- . && git reset -q
          fi
          ls site/public/estudio | wc -l
      - uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-isnet-v1
      - uses: actions/cache@v4
        with:
          path: ~/.rembg
          key: rembg-modelos-v2   # v2: + o detector de carro da montagem (medir_fotos_ml.py, 29 MB)
      # filtro de etiqueta (texto na foto): se nao instalar, a capa segue sem o filtro
      - name: Filtro de etiqueta de texto (rapidocr)
        continue-on-error: true
        run: pip install rapidocr-onnxruntime || echo "rapidocr indisponivel, capas sem filtro de etiqueta"
      - name: Gerar capas de estudio das pecas novas
        continue-on-error: true   # capa de estudio nunca pode travar a atualizacao do catalogo
        env:
          PYTHONIOENCODING: utf-8
          ESTUDIO_POR_RODADA: "150"
          ESTUDIO_VERSAO: "2"   # enquadramento novo + selo da Izzat Car no canto (aprovado pelo dono em 09/11)
          ESTUDIO_LOGO: "a"
          ESTUDIO_TEMPO_MAX: "1500"   # segundos: passou disso, para e deixa o resto pra proxima rodada
        run: |
          pip install "rembg[cpu]==2.0.*" scipy
          python -u capas_estudio.py
      # marca "e" no busca.json (0 sem capa, 1 automatica, 2 maquiada estudio-pro) MESMO se a
      # geracao acima falhou: sem este passo o site perdia a marca das capas ja prontas.
      - name: Marcar capas de estudio (sempre)
        if: always()
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python -u capas_estudio.py --so-marcar

      # ---- Enquadramento das fotos do ML na galeria da peça (site/src/data/fotos-ml-caixas.json, medido no Mac
      # com o Vision e commitado). Aqui só as fotos NOVAS são medidas (rembg), num cache próprio que o robô junta
      # ao do repositório (o do repositório manda). Foto sem medida aparece inteira, como antes.
      - uses: actions/cache/restore@v4
        with:
          path: .cache-caixas/fotos-ml-caixas.json
          key: caixas-${{ github.run_id }}
          restore-keys: caixas-
      - name: Medir as fotos novas do ML (galeria)
        continue-on-error: true   # medir foto nunca pode travar a atualização do catálogo
        timeout-minutes: 8
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # até 4 min, e só se ainda sobram 10 min para o build e a publicação. Sem tempo: só junta as medidas que o
          # robô já fez (senão a página voltava ao jeito antigo nesta rodada e mudava de novo na próxima)
          SOBRA=$(( 30 * 60 - ( $(date +%s) - INICIO ) ))
          if [ "$SOBRA" -lt 60 ]; then
            echo "sem tempo para medir nesta rodada: só junta"
            python -u ferramentas/medir_fotos_ml.py --extra .cache-caixas/fotos-ml-caixas.json --podar --so-juntar
            exit 0
          fi
          export MEDIR_TEMPO_MAX=$(( SOBRA < 240 ? SOBRA : 240 ))
          pip install "rembg[cpu]==2.0.*" scipy || echo "rembg indisponível: só junta as medidas já feitas"
          python -u ferramentas/medir_fotos_ml.py --extra .cache-caixas/fotos-ml-caixas.json --podar
      - uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with:
          path: .cache-caixas/fotos-ml-caixas.json
          key: caixas-${{ github.run_id }}
      - name: Guardar capas novas no ramo capas-estudio
        continue-on-error: true   # capa de estudio nunca pode travar a atualizacao do catalogo
        run: |
          cd site/public/estudio
          git init -q && git checkout -q -b capas-estudio
          git config user.name "izzat-bot" && git config user.email "izzat-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth=1 origin capas-estudio 2>/dev/null && git reset -q --soft FETCH_HEAD || true
          git add -A .
          if git diff --cached --quiet; then echo "nenhuma capa nova"; else
            git commit -q -m "Capas de estudio: +$(git diff --cached --name-only | wc -l)" && git push -q origin capas-estudio; fi
          rm -rf .git

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: npm --prefix site test
      - run: npm --prefix site run build
      - name: Conferir links internos (nenhum quebrado)
        run: node site/scripts/verificar-links.mjs

      # Cloudflare (opcional): so publica la se o Maruf cadastrar os 2 segredos no repo.
      # Assim a migracao pro Cloudflare e so cadastrar os segredos + apontar o dominio.
      - name: Publicar tambem no Cloudflare (se configurado)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: env.TEM_CLOUDFLARE == 'true'
        run: cd site && npx wrangler deploy --config wrangler.jsonc

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000   # 10 min é o máximo que a ação aceita; se estourar, o passo abaixo tenta de novo
          error_count: 10
        continue-on-error: true
      - name: Publicar (2ª tentativa, se a 1ª estourou o tempo)
        if: steps.deploy.outcome == 'failure'
        id: deploy2
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 10
